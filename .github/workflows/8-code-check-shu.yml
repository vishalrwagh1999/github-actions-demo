name: Code Scan using matrix by shu

on:
  workflow_dispatch:
 # push:
 #   branches: [main]

jobs:
  linter:
    # server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # get the latest code in that server
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install linter flake 8
        run: pip install flake8

      - name: scan code for syntax
        run: flake8 app.py

        
