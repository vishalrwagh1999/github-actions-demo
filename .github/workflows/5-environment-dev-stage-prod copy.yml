name: CICD_with_dev_stage_prod

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: which env you have to build please select from below
        default: "dev"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
        

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        run: echo "git pull to get code" #orignal commands not added yet this is for practice only
  build:
      needs: [code] #inside job name we are specifying the needs parameter and inside that we are giving the name of job which is code because build job is dependent on code job
      runs-on: ubuntu-latest
      steps:
        - name: build the code
          run: echo "mavne build" #orignal commands not added yet this is for practice only
  test:
      needs: [build]
      runs-on: ubuntu-latest
      steps:
        - name: test using tivy or jemeter junit
          run: echo "testing commands" #orignal commands not added yet this is for practice only
  deploy:
      needs: [build,test]
      runs-on: ubuntu-latest
      steps:
        - name: deploy the code on server
          run: echo "deploy the code on server ec2 or cloud" #orignal commands not added yet this is for practice only