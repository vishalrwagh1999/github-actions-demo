name: secret scan

on :
    workflow_call:
jobs:
    secret_scan-Gitleaks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0 # Fetches all history so Trufflehog can scan entire commit histories

              # Step 2: Run Gitleaks to find exposed credentials
            - name: Run Gitleaks to check for secrets and credentials
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for corporate Organizations, leave blank for personal accounts