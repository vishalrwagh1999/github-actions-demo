---
name: build-push-python-flask-docker-image-to-dockerhub
on:
  workflow_dispatch:
jobs:
  build-push-python-flask-docker-image-to-dockerhub: 
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          #registry: docker.io or ghcr.io or any other registry with the url - If not set then will default to Docker Hub
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to default registry (Docker Hub)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/python-flask-app-github-actions:latest                  #latest tag
            ${{ vars.DOCKERHUB_USERNAME }}/python-flask-app-github-actions:${{ github.sha }}       #hash of the commit as tag
            ${{ vars.DOCKERHUB_USERNAME }}/python-flask-app-github-actions:${{ github.ref_name }}  #branch name as tag

